name: pulse
description: "PULSE — an offline sales command centre demo built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  json_annotation: ^4.9.0
  fl_chart: ^1.3.0
  intl: ^0.20.3
  timezone: ^0.10.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.11.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/data/demo/
    - assets/branding/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#0B1020"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  # Plain light screen with no icon: the animated intro draws the logo, so a
  # native icon here would appear, vanish and reappear (a visible blink).
  color: "#F4F5F7"
  color_dark: "#F4F5F7"
  android_12:
    color: "#F4F5F7"
    color_dark: "#F4F5F7"
    icon_background_color: "#F4F5F7"
    icon_background_color_dark: "#F4F5F7"
    image: "assets/branding/splash_blank.png"
    image_dark: "assets/branding/splash_blank.png"
  ios: true
  android: true
  web: false
